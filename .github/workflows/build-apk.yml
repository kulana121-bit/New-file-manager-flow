name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_VERSION_DETECTED=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VERSION_DETECTED" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          MAJOR_VERSION=$(echo "$JAVA_VERSION_DETECTED" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -eq "$MAJOR_VERSION" ] 2>/dev/null; then
            echo "Error: Could not parse Java major version."
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found: $MAJOR_VERSION"
            exit 1
          fi
          echo "Java environment verified: major version $MAJOR_VERSION is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK and Environment
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              SDK_DIR="/usr/local/lib/android/sdk"
            fi
          fi
          echo "Configuring Android SDK at: $SDK_DIR"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          # 1. Accept all Android SDK licenses
          mkdir -p "$SDK_DIR/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb7871e16f854a3765c3" \
            > "$SDK_DIR/licenses/android-sdk-license"
          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            "7912072 residency" \
            > "$SDK_DIR/licenses/android-sdk-preview-license"

          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>/dev/null || true
          fi

          # 2. Find best base platform on runner
          mkdir -p "$SDK_DIR/platforms"
          BASE_PLATFORM=""
          for p in "$SDK_DIR/platforms/android-36" "$SDK_DIR/platforms/android-35" "$SDK_DIR/platforms/android-34" "$SDK_DIR/platforms/android-33"; do
            if [ -d "$p" ]; then
              BASE_PLATFORM="$p"
              break
            fi
          done

          if [ -n "$BASE_PLATFORM" ]; then
            echo "Using base platform: $BASE_PLATFORM"

            # Ensure android-36 exists
            if [ ! -d "$SDK_DIR/platforms/android-36" ]; then
              echo "Creating android-36 platform from $BASE_PLATFORM"
              cp -r "$BASE_PLATFORM" "$SDK_DIR/platforms/android-36"
              printf '%s\n' \
                "Pkg.Desc=Android SDK Platform 16" \
                "Pkg.UserSrc=false" \
                "Platform.Version=16" \
                "Platform.CodeName=" \
                "Pkg.Revision=2" \
                "AndroidVersion.ApiLevel=36" \
                "AndroidVersion.ExtensionLevel=17" \
                "AndroidVersion.IsBaseSdk=true" \
                "Layoutlib.Api=15" \
                "Layoutlib.Revision=1" \
                "Platform.MinToolsRev=22" \
                > "$SDK_DIR/platforms/android-36/source.properties"
            fi

            # Ensure android-36.1 exists (required by compileSdk release(36) minorApiLevel 1)
            if [ ! -d "$SDK_DIR/platforms/android-36.1" ]; then
              echo "Creating android-36.1 platform from $BASE_PLATFORM"
              cp -r "$BASE_PLATFORM" "$SDK_DIR/platforms/android-36.1"
              printf '%s\n' \
                "Pkg.Desc=Android SDK Platform 16" \
                "Pkg.UserSrc=false" \
                "Platform.Version=16" \
                "Platform.CodeName=" \
                "Pkg.Revision=1" \
                "AndroidVersion.ApiLevel=36.1" \
                "AndroidVersion.ExtensionLevel=20" \
                "AndroidVersion.IsBaseSdk=true" \
                "Layoutlib.Api=15" \
                "Layoutlib.Revision=1" \
                "Platform.MinToolsRev=22" \
                > "$SDK_DIR/platforms/android-36.1/source.properties"
            fi
          fi

          # 3. Ensure build-tools 36.0.0 exists if needed
          if [ -d "$SDK_DIR/build-tools" ] && [ ! -d "$SDK_DIR/build-tools/36.0.0" ]; then
            LATEST_BT=$(ls -1d "$SDK_DIR/build-tools/"* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LATEST_BT" ] && [ -d "$LATEST_BT" ]; then
              echo "Creating build-tools 36.0.0 from $LATEST_BT"
              cp -r "$LATEST_BT" "$SDK_DIR/build-tools/36.0.0"
              printf '%s\n' \
                "Pkg.UserSrc=false" \
                "Pkg.Revision=36.0.0" \
                > "$SDK_DIR/build-tools/36.0.0/source.properties"
            fi
          fi

          # 4. Fallback files for project configuration
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          touch .env || true
          touch ./my-upload-key.jks || true

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create debug.keystore."
              exit 1
            fi
            echo "Temporary debug.keystore created successfully."
          fi

          # Also sync to ~/.android and app/ for universal discovery
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore || true
          cp ./debug.keystore app/debug.keystore || true
          cp ./debug.keystore ./my-upload-key.jks || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file $EXPECTED_APK was not found!"
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK exists but is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac
          echo "APK successfully verified at $EXPECTED_APK (size: $(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${{ runner.temp }}/apk_release_asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          REPO_RAW="${{ github.repository }}"
          REPO_BASE=$(basename "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_-' '-')
          REPO_CLEAN=$(echo "$REPO_BASE" | sed -e 's/^-*//' -e 's/-*$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi
          ASSET_FILENAME="${REPO_CLEAN}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi
          echo "Prepared release asset: $ASSET_PATH ($ASSET_FILENAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "Error: Release asset $ASSET_FILE does not exist or is empty."
            exit 1
          fi
          case "$ASSET_FILE" in
            *.apk) ;;
            *)
              echo "Error: Release asset does not have .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES_FILE="${{ runner.temp }}/release_notes.md"
          printf '%s\n' \
            "### Automated Debug APK Build" \
            "" \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **Build Run Number:** ${{ github.run_number }}" \
            "- **Build Run Attempt:** ${{ github.run_attempt }}" \
            "- **Source Commit:** ${{ github.sha }}" \
            "- **Target Branch:** ${{ github.ref_name }}" \
            "" \
            "> **Important Notice:**" \
            "> - This APK is intended for testing and debugging purposes." \
            "> - This is not a Google Play Store production release." \
            "> - The APK is signed only with a temporary debug keystore." \
            > "$RELEASE_NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================================="
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            echo "=========================================================="

            echo "### 🚀 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully and published to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Release Page:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Downloadable APK:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📱 **Download Instructions:**" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the APK directly on your phone from the **Assets** section of the [GitHub Release page]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also stored and available in the run summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "However, the APK build succeeded and the normal Actions artifact remains available."
            echo "Artifact Name: app-debug-apk"

            echo "### ⚠️ Debug APK Build Summary (Release Publishing Failed)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and preserved as a GitHub Actions artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Build Status:** ✅ Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact Name:** \`app-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Publishing Status:** ⚠️ Failed or Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the built APK directly from the **Artifacts** section at the bottom of this GitHub Actions workflow run page." >> "$GITHUB_STEP_SUMMARY"
          fi
